<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BUSIN 剧本翻译预览</title>
  <style>
    @font-face {
      font-family: "LXGW WenKai";
      src: url("../data/font/LXGWWenKai-Regular.ttf") format("truetype");
      font-display: swap;
    }
    :root {
      color-scheme: dark;
      --bg: #101419;
      --panel: #1a2027;
      --panel-2: #202832;
      --line: #34404c;
      --text: #edf2f5;
      --muted: #9ba9b5;
      --accent: #e5a24b;
      --good: #79c99a;
      --bad: #ed7777;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .app { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 44px; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 22px; }
    h1 { margin: 0; font-size: 25px; letter-spacing: .02em; }
    .subtitle { margin: 5px 0 0; color: var(--muted); }
    .badge {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 11px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .layout { display: grid; grid-template-columns: minmax(300px, 390px) minmax(0, 1fr); gap: 20px; align-items: start; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
    }
    .panel h2 { margin: 0 0 13px; font-size: 15px; }
    label { display: block; color: var(--muted); font-size: 12px; margin: 12px 0 6px; }
    textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel-2);
      color: var(--text);
      padding: 10px 11px;
      font: 13px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace;
      resize: vertical;
    }
    textarea { min-height: 185px; }
    textarea.source { min-height: 92px; }
    select { font: 14px system-ui, sans-serif; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .actions { display: flex; gap: 9px; margin-top: 15px; }
    button {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #2a3540;
      color: var(--text);
      padding: 8px 13px;
      cursor: pointer;
      font: 14px system-ui, sans-serif;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #21170c; font-weight: 700; }
    button:hover { filter: brightness(1.1); }
    .hint { margin: 11px 0 0; color: var(--muted); font-size: 12px; }
    .preview { min-width: 0; }
    .preview-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
    .preview-bar h2 { margin: 0; font-size: 15px; }
    .scale { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
    .scale select { width: auto; padding: 5px 8px; }
    .game-frame {
      width: 100%;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #0c1014;
    }
    canvas { display: block; width: 100%; height: auto; image-rendering: auto; }
    .status { min-height: 22px; margin: 9px 2px 0; color: var(--muted); font-size: 12px; }
    .status.good { color: var(--good); }
    .status.bad { color: var(--bad); }
    .lower { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 350px); gap: 20px; margin-top: 20px; }
    .source-box {
      min-height: 115px;
      margin: 0;
      padding: 12px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel-2);
      color: #d7e2e8;
      white-space: pre-wrap;
      word-break: break-word;
      font: 13px/1.7 ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 7px 5px; border-bottom: 1px solid var(--line); text-align: left; }
    th { color: var(--muted); font-weight: 500; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .ok { color: var(--good); }
    .over { color: var(--bad); font-weight: 700; }
    details { margin-top: 13px; color: var(--muted); }
    summary { cursor: pointer; }
    .parsed { margin: 8px 0 0; max-height: 175px; overflow: auto; color: #c8d3da; font: 12px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap; }
    @media (max-width: 880px) {
      .layout, .lower { grid-template-columns: 1fr; }
      header { align-items: start; flex-direction: column; gap: 10px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>BUSIN 剧本翻译预览</h1>
        <p class="subtitle">按游戏的固定格子预览译文、行首排版和对话框容量。</p>
      </div>
      <div class="badge">640 × 448 · 24 px / 格</div>
    </header>

    <section class="layout">
      <div class="panel">
        <h2>输入</h2>
        <label for="payload">消息 JSON，或每行一条译文</label>
        <textarea id="payload" spellcheck="false"></textarea>
        <label for="source">source（可选，用来对照排版码）</label>
        <textarea id="source" class="source" spellcheck="false"></textarea>
        <div class="controls">
          <div>
            <label for="type">类型</label>
            <select id="type">
              <option value="dialog">dialog</option>
              <option value="center">center</option>
              <option value="subtitle">subtitle</option>
            </select>
          </div>
          <div>
            <label for="align">行首读法</label>
            <select id="align">
              <option value="left">left</option>
              <option value="center">center</option>
            </select>
          </div>
        </div>
        <div class="actions">
          <button class="primary" id="render">刷新预览</button>
          <button id="example">载入示例</button>
        </div>
        <p class="hint">支持的行首排版：<code>&lt;FFC0&gt;</code>–<code>&lt;FFC9&gt;</code> 选项行号，<code>&lt;FFD0&gt;</code>–<code>&lt;FFDF&gt;</code> 缩进，<code>&lt;STYLE:0&gt;</code>–<code>&lt;STYLE:7&gt;</code> 样式。缩进空格也按一格计算。</p>
      </div>

      <div class="preview">
        <div class="preview-bar">
          <h2>游戏画面预览</h2>
          <label class="scale">缩放
            <select id="scale">
              <option value="1">1×（640×448）</option>
              <option value="1.5">1.5×</option>
              <option value="2">2×</option>
            </select>
          </label>
        </div>
        <div class="game-frame">
          <canvas id="game" width="640" height="448" aria-label="游戏翻译预览画面"></canvas>
        </div>
        <div id="status" class="status">正在解析。</div>
      </div>
    </section>

    <section class="lower">
      <div class="panel">
        <h2>source 对照</h2>
        <pre id="source-view" class="source-box">—</pre>
        <details>
          <summary>解析结果</summary>
          <pre id="parsed" class="parsed">—</pre>
        </details>
      </div>
      <div class="panel">
        <h2>格子检查</h2>
        <table>
          <thead>
            <tr><th class="num">行</th><th>排版</th><th class="num">已用</th><th class="num">上限</th><th>结果</th></tr>
          </thead>
          <tbody id="checks"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const CELL = 24;
      const FRAME_W = 640;
      const FRAME_H = 448;
      const STYLE_COLORS = [
        "#f1eee7", "#f0b24e", "#76c99a", "#e98282",
        "#83bde8", "#c29be8", "#e8df9b", "#d6e2e8"
      ];
      const EXAMPLE = {
        type: "dialog",
        source: "グレッグ「私は己の名と職を\n<FFD4>捨てるつもりはない」",
        text: [
          "格雷格「己之名和职",
          "<FFD3>我无意舍弃」"
        ]
      };

      const $ = (id) => document.getElementById(id);
      const payload = $("payload");
      const source = $("source");
      const type = $("type");
      const align = $("align");
      const scale = $("scale");
      const canvas = $("game");
      const ctx = canvas.getContext("2d");

      function escapeHtml(value) {
        return String(value).replace(/[&<>"]/g, (char) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;"
        }[char]));
      }

      function parsePayload(raw) {
        const trimmed = raw.trim();
        if (!trimmed) return { text: [], source: "" };
        try {
          const value = JSON.parse(trimmed);
          if (Array.isArray(value)) return { text: value.map(String), source: source.value };
          if (value && typeof value === "object") {
            return {
              text: Array.isArray(value.text) ? value.text.map(String) : String(value.text || "").split(/\r?\n/),
              source: String(value.source || source.value || "")
            };
          }
        } catch (_) {
          // Plain text is one translated line per row.
        }
        return { text: trimmed.split(/\r?\n/), source: source.value };
      }

      function tags(line) {
        const result = [];
        const re = /<([^<>]+)>/g;
        let last = 0;
        let match;
        while ((match = re.exec(line))) {
          if (match.index > last) result.push({ text: line.slice(last, match.index) });
          result.push({ tag: match[1] });
          last = match.index + match[0].length;
        }
        if (last < line.length) result.push({ text: line.slice(last) });
        return result;
      }

      function isLayoutTag(tag) {
        return /^(FFC[0-9A-F]|FFD[0-9A-F]|STYLE:[0-7])$/i.test(tag);
      }

      function layoutPrefix(parts) {
        const prefix = { indent: 0, style: 0, choice: null };
        let index = 0;
        while (index < parts.length) {
          const part = parts[index];
          if (part.text !== undefined) {
            const spaces = part.text.match(/^ +/);
            if (!spaces) break;
            prefix.indent += spaces[0].length;
            part.text = part.text.slice(spaces[0].length);
            if (!part.text) index += 1;
            continue;
          }
          const tag = part.tag.toUpperCase();
          if (tag === "STYLE:0" || /^STYLE:[1-7]$/.test(tag)) {
            prefix.style = Number(tag.slice(6));
          } else if (/^FFD[0-9A-F]$/.test(tag)) {
            prefix.indent = parseInt(tag.slice(2), 16) - 0xD0 + 1;
          } else if (/^FFC[0-9A-F]$/.test(tag)) {
            prefix.choice = parseInt(tag.slice(2), 16) - 0xC0;
          } else {
            break;
          }
          index += 1;
        }
        return { prefix, body: parts.slice(index) };
      }

      function bodyRows(line) {
        const split = layoutPrefix(tags(line));
        const rows = [];
        let current = [];
        let style = split.prefix.style;
        for (const part of split.body) {
          if (part.tag !== undefined && part.tag.toUpperCase() === "BREAK") {
            rows.push({ prefix: rows.length ? { indent: 0, style, choice: null } : split.prefix, parts: current });
            current = [];
            continue;
          }
          if (part.tag !== undefined && /^STYLE:[0-7]$/i.test(part.tag)) {
            style = Number(part.tag.slice(6));
            current.push({ tag: part.tag.toUpperCase() });
            continue;
          }
          current.push(part);
        }
        rows.push({ prefix: rows.length ? { indent: 0, style, choice: null } : split.prefix, parts: current });
        return rows;
      }

      function visibleText(parts) {
        let out = "";
        for (const part of parts) {
          if (part.text !== undefined) out += part.text;
          else if (/^STYLE:[0-7]$/i.test(part.tag)) continue;
          else if (/^FF[CD][0-9A-F]$/i.test(part.tag)) continue;
          else if (part.tag === "PAGE") out += "主";
          else if (part.tag === "FE00") out += "名";
          else if (/^FFF[0-5]$/.test(part.tag.toUpperCase())) out += part.tag.slice(3);
          else if (/^(FB|FD|F[0-9A-F]{3})/.test(part.tag.toUpperCase())) continue;
          else out += "◆";
        }
        return out;
      }

      function bodyCells(parts) {
        return visibleText(parts).length;
      }

      function limitFor(row, kind) {
        const base = kind === "subtitle" ? 21 : 19;
        return kind === "dialog" ? Math.max(0, base - row.prefix.indent) : base;
      }

      function drawBackground() {
        const gradient = ctx.createLinearGradient(0, 0, 0, FRAME_H);
        gradient.addColorStop(0, "#25323a");
        gradient.addColorStop(0.55, "#161d23");
        gradient.addColorStop(1, "#0c1115");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, FRAME_W, FRAME_H);

        ctx.fillStyle = "rgba(130, 156, 163, .12)";
        for (let i = 0; i < 13; i += 1) {
          const x = (i * 83 + 17) % FRAME_W;
          const y = 52 + ((i * 47) % 180);
          ctx.fillRect(x, y, 42 + (i % 4) * 17, 72 + (i % 3) * 25);
        }
        ctx.fillStyle = "rgba(0, 0, 0, .18)";
        ctx.fillRect(0, 225, FRAME_W, 223);
      }

      function drawGlyph(char, x, y, color) {
        if (!char) return;
        ctx.save();
        ctx.font = '24px "LXGW WenKai", "Microsoft YaHei", sans-serif';
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.lineWidth = 4;
        ctx.strokeStyle = "rgba(0, 0, 0, .88)";
        ctx.strokeText(char, x + CELL / 2, y + CELL / 2);
        ctx.fillStyle = color;
        ctx.fillText(char, x + CELL / 2, y + CELL / 2);
        ctx.restore();
      }

      function drawChoiceMark(choice, x, y) {
        ctx.save();
        ctx.fillStyle = "#e7a64e";
        ctx.beginPath();
        ctx.arc(x + 5, y + CELL / 2, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#f2d29f";
        ctx.font = "11px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        if (choice !== null) ctx.fillText(String(choice), x + 5, y + CELL / 2 + 0.5);
        ctx.restore();
      }

      function drawRow(row, y, kind, alignMode) {
        const text = visibleText(row.parts);
        const limit = limitFor(row, kind);
        const usable = kind === "dialog" ? 19 : (kind === "subtitle" ? 21 : 19);
        const startCell = kind === "dialog"
          ? row.prefix.indent
          : Math.max(0, Math.floor((usable - text.length) / 2) + row.prefix.indent);
        const x0 = 48 + startCell * CELL;
        if (row.prefix.choice !== null) drawChoiceMark(row.prefix.choice, 32, y);
        let cell = 0;
        let style = row.prefix.style;
        for (const part of row.parts) {
          if (part.text !== undefined) {
            for (const char of part.text) {
              drawGlyph(char, x0 + cell * CELL, y, STYLE_COLORS[style] || STYLE_COLORS[0]);
              cell += 1;
            }
          } else if (/^STYLE:[0-7]$/i.test(part.tag)) {
            style = Number(part.tag.slice(6));
          }
        }
        return { used: bodyCells(row.parts), limit };
      }

      function render() {
        const parsed = parsePayload(payload.value);
        if (source.value.trim() === "" && parsed.source) source.value = parsed.source;
        const kind = type.value;
        const alignMode = align.value;
        const rows = parsed.text.flatMap(bodyRows);
        const visible = rows.slice(0, kind === "dialog" ? 4 : 6);

        drawBackground();
        if (kind === "dialog") {
          ctx.fillStyle = "rgba(8, 11, 14, .91)";
          ctx.fillRect(22, 250, 596, 171);
          ctx.strokeStyle = "rgba(218, 183, 119, .65)";
          ctx.lineWidth = 2;
          ctx.strokeRect(22, 250, 596, 171);
          ctx.fillStyle = "rgba(231, 174, 86, .8)";
          ctx.fillRect(22, 250, 596, 2);
        } else {
          ctx.fillStyle = "rgba(7, 10, 13, .42)";
          ctx.fillRect(18, 44, 604, 110);
        }

        const y0 = kind === "dialog" ? 277 : 70;
        const step = 29;
        const checks = visible.map((row, index) => ({
          index: index + 1,
          row,
          result: drawRow(row, y0 + index * step, kind, alignMode)
        }));
        if (kind === "dialog") {
          ctx.fillStyle = "#dc9a45";
          ctx.beginPath();
          ctx.moveTo(590, 386);
          ctx.lineTo(601, 386);
          ctx.lineTo(595.5, 395);
          ctx.closePath();
          ctx.fill();
        }

        const over = checks.filter((item) => item.result.used > item.result.limit);
        const status = $("status");
        status.className = "status " + (over.length ? "bad" : "good");
        status.textContent = over.length
          ? `有 ${over.length} 行超出格子：${over.map((item) => `第 ${item.index} 行 ${item.result.used}/${item.result.limit}`).join("，")}`
          : `${rows.length} 行解析完成，所有可见行都在格子内。`;

        $("checks").innerHTML = checks.map((item) => {
          const good = item.result.used <= item.result.limit;
          return `<tr>
            <td class="num">${item.index}</td>
            <td>${item.row.prefix.indent ? `缩进 ${item.row.prefix.indent}` : "顶格"}${item.row.prefix.choice !== null ? ` · 选项 ${item.row.prefix.choice}` : ""}</td>
            <td class="num">${item.result.used}</td>
            <td class="num">${item.result.limit}</td>
            <td class="${good ? "ok" : "over"}">${good ? "通过" : "超出"}</td>
          </tr>`;
        }).join("") || `<tr><td colspan="5">还没有可预览的译文。</td></tr>`;

        $("source-view").textContent = source.value || "—";
        $("parsed").textContent = JSON.stringify({
          type: kind,
          align: alignMode,
          lines: rows.map((row) => ({
            indent: row.prefix.indent,
            style: row.prefix.style,
            choice: row.prefix.choice,
            text: visibleText(row.parts),
            cells: bodyCells(row.parts),
            limit: limitFor(row, kind)
          }))
        }, null, 2);
      }

      function loadExample() {
        payload.value = JSON.stringify(EXAMPLE, null, 2);
        source.value = EXAMPLE.source;
        type.value = EXAMPLE.type;
        align.value = "left";
        render();
      }

      $("render").addEventListener("click", render);
      $("example").addEventListener("click", loadExample);
      payload.addEventListener("input", render);
      source.addEventListener("input", render);
      type.addEventListener("change", render);
      align.addEventListener("change", render);
      scale.addEventListener("change", () => {
        const width = FRAME_W * Number(scale.value);
        canvas.style.width = `${width}px`;
        document.querySelector(".game-frame").style.width = `${width + 2}px`;
      });
      loadExample();
      scale.dispatchEvent(new Event("change"));
    })();
  </script>
</body>
</html>
